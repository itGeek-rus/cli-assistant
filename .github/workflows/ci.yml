name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o bin/assistant ./cmd/app

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.62.2

      - name: Lint
        run: golangci-lint run ./...

      - name: Install go-arch-lint
        run: go install github.com/fe3dback/go-arch-lint@latest

      - name: Architecture lint
        run: go-arch-lint check

      - name: Build with version
        run: |
          go build -ldflags "-s -w \
            -X cli-assistant/pkg/version.Version=${{ github.sha }} \
            -X cli-assistant/pkg/version.Commit=${{ github.sha }} \
            -X cli-assistant/pkg/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o bin/assistant ./cmd/app
          ./bin/assistant version

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: cli-assistant:ci
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.run_started_at }}

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
      - run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - run: gosec -exclude=G104 ./...

  integration:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: docker compose -f docker-compose-integration.yml up -d --wait
      - run: go build -o bin/assistant ./cmd/app
      - run: INTEGRATION=1 ASSISTANT_BIN=./bin/assistant go test -tags=integration ./test/integration/...
      - if: always()
        run: docker compose -f docker-compose-integration.yml down -v
