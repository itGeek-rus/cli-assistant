name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build binaries
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              GOOS=$os GOARCH=$arch go build -trimpath -ldflags "\
                -s -w \
                -X cli-assistant/pkg/version.Version=${VERSION} \
                -X cli-assistant/pkg/version.Commit=${GITHUB_SHA::7} \
                -X cli-assistant/pkg/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                -o "dist/assistant-${VERSION}-${os}-${arch}" ./cmd/app
            done
          done
          (cd dist && sha256sum assistant-* > checksums.sha256)

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
