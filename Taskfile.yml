version: "3"

vars:
  BINARY: assistant
  CMD: ./cmd/app
  OUT: bin/{{.BINARY}}
  VERSION:
    sh: |
      v=$(git describe --tags --always --dirty 2>/dev/null | sed 's/^v//')
      echo "${v:-dev}"
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo none
  BUILD_DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LDFLAGS: >-
    -s -w
    -X cli-assistant/pkg/version.Version={{.VERSION}}
    -X cli-assistant/pkg/version.Commit={{.COMMIT}}
    -X cli-assistant/pkg/version.BuildDate={{.BUILD_DATE}}

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build binary to bin/assistant
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o {{.OUT}} {{.CMD}}
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.OUT}}"

  docker:build:
    desc: Build container image
    cmds:
      - >-
        docker build
        --build-arg VERSION={{.VERSION}}
        --build-arg COMMIT={{.COMMIT}}
        --build-arg BUILD_DATE={{.BUILD_DATE}}
        -t cli-assistant:{{.VERSION}} .

  docker:run:
    desc: Run assistant in container (pass args after --)
    deps: [docker:build]
    cmds:
      - docker run --rm -v "$HOME/.config/cli_assistant:/home/nonroot/.config/cli_assistant:ro" cli-assistant:{{.VERSION}} {{.CLI_ARGS}}

  run:
    desc: Run without installing (pass CLI args after --)
    cmds:
      - go run {{.CMD}} -- {{.CLI_ARGS}}

  install:
    desc: Install binary to GOPATH/bin and install assistant to GOPATH/bin
    cmds:
      - go install {{.CMD}}
      - go build -ldflags "{{.LDFLAGS}}" -o $(go env GOPATH)/bin/assistant {{.CMD}}

  test:
    desc: Run unit tests
    cmds:
      - go test ./...

  test:race:
    desc: Run tests with race detector
    cmds:
      - go test -race ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Format Go code
    cmds:
      - gofmt -w .

  tidy:
    desc: Tidy go.mod
    cmds:
      - go mod tidy

  check:
    desc: vet + test (CI-friendly)
    deps:
      - vet
      - test

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f {{.OUT}}

  demo:list:
    desc: deploy list (noop)
    deps: [build]
    cmds:
      - "{{.OUT}} deploy list"

  demo:health:
    desc: observe health (noop)
    deps: [build]
    cmds:
      - "{{.OUT}} observe health"

  demo:status:
    desc: deploy status for app name (usage task demo:status -- my-app)
    deps: [build]
    cmds:
      - "{{.OUT}} deploy status {{.CLI_ARGS}}"

  vuln:
    desc: Run vulnerability scanner (govulncheck)
    cmds:
      - go install golang.org/x/vuln/cmd/govulncheck@latest
      - govulncheck ./...

  gosec:
    desc: Run gosec security linter
    cmds:
      - go install github.com/securego/gosec/v2/cmd/gosec@latest
      - gosec -exclude=G104 ./...

  deps:
    desc: Check dependencies for known vulnerabilities (Nancy)
    cmds:
      - go list -json -deps ./... | nancy sleuth

  lint:
    desc: Run golangci-lint (requires .golangci.yml)
    cmds:
      - golangci-lint run ./...

  arch:
    desc: Check architecture rules (.go-arch-lint.yml)
    cmds:
      - go-arch-lint check

  precommit:
    desc: Quick checks for pre-commit hook
    cmds:
      - task: fmt
      - task: vet
      - task: lint

  demo:query:
    desc: observe query up (noop)
    deps: [ build ]
    cmds:
      - '{{.OUT}} observe query up'

  demo:alerts:
    desc: observe alerts (noop)
    deps: [ build ]
    cmds:
      - '{{.OUT}} observe alerts'

  demo:logs:
    desc: observe logs demo (noop)
    deps: [ build ]
    cmds:
      - '{{.OUT}} observe logs ''{app="demo-app"}'' --since 30m --limit 10'

  demo:inspect:
    desc: deploy inspect demo (noop)
    deps: [ build ]
    cmds:
      - "{{.OUT}} deploy inspect demo-app"

  demo:version:
    desc: print build version
    deps: [ build ]
    cmds:
      - "{{.OUT}} version"

  cleancode:
    desc: Run all code quality & security checks
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: gosec
      - task: test
      - task: arch
    deps: [tidy]

  integration:up:
    desc: Start WireMock stack
    cmds:
      - docker compose -f docker-compose-integration.yml up -d

  integration:down:
    cmds:
      - docker compose -f docker-compose-integration.yml down -v

  test:integration:
    desc: Integration tests (WireMock)
    deps: [integration:up]
    env:
      INTEGRATION: "1"
      ASSISTANT_BIN: "{{.TASKFILE_DIR}}/{{.OUT}}"
    cmds:
      - defer: { task: integration:down }
      - go build -ldflags "{{.LDFLAGS}}" -o {{.OUT}} {{.CMD}}
      - go test -tags=integration ./test/integration/...

  dev:up:
    desc: Start local Prometheus/Loki/Alertmanager/Grafana
    cmds:
      - docker compose up -d

  dev:down:
    cmds:
      - docker compose down -v

  db:up:
    desc: Start Postgres and run migrations
    cmds: [docker compose up -d postgres migrate]

  db:migrate:
    cmds:
      - migrate -path migrations/sql -database "$CLI_ASSISTANT_DATABASE_URL" up

  db:down:
    cmds:
      - migrate -path migrations/sql -database "$CLI_ASSISTANT_DATABASE_URL" down 1

  local-run:
    desc: Start postgres, migrate, build and run REST API locally
    deps: [build, db:up]
    dotenv: ['.env']
    cmds:
      - '{{.OUT}} server'