version: "3"

vars:
  BINARY: assistant
  CMD: ./cmd/app
  OUT: bin/{{.BINARY}}

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build binary to bin/assistant
    cmds:
      - go build -o {{.OUT}} {{.CMD}}
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.OUT}}"

  run:
    desc: Run without installing (pass CLI args after --)
    cmds:
      - go run {{.CMD}} -- {{.CLI_ARGS}}

  install:
    desc: Install binary to GOPATH/bin
    cmds:
      - go install {{.CMD}}

  test:
    desc: Run unit tests
    cmds:
      - go test ./...

  test:race:
    desc: Run tests with race detector
    cmds:
      - go test -race ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Format Go code
    cmds:
      - gofmt -w .

  tidy:
    desc: Tidy go.mod
    cmds:
      - go mod tidy

  check:
    desc: vet + test (CI-friendly)
    deps:
      - vet
      - test

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f {{.OUT}}

  demo:list:
    desc: deploy list (noop)
    deps: [build]
    cmds:
      - "{{.OUT}} deploy list"

  demo:health:
    desc: observe health (noop)
    deps: [build]
    cmds:
      - "{{.OUT}} observe health"

  demo:status:
    desc: deploy status for app name (usage task demo:status -- my-app)
    deps: [build]
    cmds:
      - "{{.OUT}} deploy status {{.CLI_ARGS}}"

  vuln:
    desc: Run vulnerability scanner (govulncheck)
    cmds:
      - go install golang.org/x/vuln/cmd/govulncheck@latest
      - govulncheck ./...

  gosec:
    desc: Run gosec security linter
    cmds:
      - go install github.com/securego/gosec/v2/cmd/gosec@latest
      - gosec -exclude=G104 ./...

  deps:
    desc: Check dependencies for known vulnerabilities (Nancy)
    cmds:
      - go list -json -deps ./... | nancy sleuth

  lint:
    desc: Run golangci-lint (requires .golangci.yml)
    cmds:
      - golangci-lint run ./...

  arch:
    desc: Check architecture rules (.go-arch-lint.yml)
    cmds:
      - go-arch-lint check

  cleancode:
    desc: Run all code quality & security checks
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: gosec
      - task: test
    deps: [tidy]

  precommit:
    desc: Quick checks for pre-commit hook
    cmds:
      - task: fmt
      - task: vet
      - task: lint

  demo:query:
    desc: observe query up (noop)
    deps: [build]
    cmds:
      - '{{.OUT}} observe query up'

  demo:alerts:
    desc: observe alerts (noop)
    deps: [build]
    cmds:
      - '{{.OUT}} observe alerts'