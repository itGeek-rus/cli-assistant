log_level: info
output: human
profile: default

gitops:
  provider: noop

observability:
  provider: noop

profiles:
  default:
    kube_context: minikube
    gitops_url: https://argocd.example.com
    gitops_token_env: ARGOCD_AUTH_TOKEN
    gitops_insecure: false
    metrics_url: http://localhost:9090
    logs_url: http://localhost:3100
